<!-- Botón hamburguesa con soporte para modo claro y oscuro -->
<button id="menuButton"
  onclick="
    document.getElementById('sidebar').classList.remove('translate-x-full');
    this.classList.add('hidden');
  "
  class="fixed top-6 pt-2 right-4 z-50 p-0 bg-transparent border-none shadow-none">
  <div class="flex flex-col justify-between space-y-1 items-end">
    <div class="w-3 h-[3px] bg-black dark:bg-white rounded"></div>
    <div class="w-5 h-[3px] bg-black dark:bg-white rounded"></div>
    <div class="w-7 h-[3px] bg-black dark:bg-white rounded"></div>
  </div>
</button>


<!-- Menú lateral -->
 <div id="sidebar" class=" fixed top-0 right-0 h-full w-72 bg-white dark:bg-gray-900 text-gray-800 dark:text-white shadow-lg flex flex-col transform translate-x-full transition-transform duration-300 z-40 ">
 <!-- Botón cerrar flotante en la esquina superior derecha -->
<button onclick="
  document.getElementById('sidebar').classList.add('translate-x-full');
  document.getElementById('menuButton').classList.remove('hidden');"
  class="absolute top-2 right-2 text-black hover:text-pink-500 text-3xl font-bold z-50">
  &times;
</button>

  <!-- Encabezado fijo con usuario -->
 <div class="animate__animated animate__slideInRight flex flex-col items-center space-y-2 border-b pb-4 pt-6 px-6 bg-white dark:bg-gray-900 sticky top-0 z-10">
 
  <img src="https://i.pravatar.cc/100" alt="Usuario"
    class="w-16 h-16 rounded-full border-4 border-pink-300 dark:border-pink-400 shadow" />
  <div class="text-center">
    <p class="text-lg font-semibold text-gray-800 dark:text-white">{{ nombreCompleto || 'Nombre Usuario' }}</p>
    <p class="text-sm text-pink-500 dark:text-pink-400">{{ usuario || 'Nombre Usuario' }}</p>
  </div>
</div>


  <!-- Contenido desplazable -->
  <div class=" flex-1 overflow-y-auto px-6 py-4 space-y-2 text-gray-800 dark:text-white">
    <a routerLink="/main/perfil" onclick="
  document.getElementById('sidebar').classList.add('translate-x-full');
  document.getElementById('menuButton').classList.remove('hidden');" class="flex items-center gap-3 hover:bg-pink-100 py-2 px-4 rounded-md transition">

        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"

      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2zm0 8c-4-4-6-7-6-10a6 6 0 1112 0c0 3-2 6-6 10z" />
  </svg><span>Donde nos encontramos</span>

    <a routerLink="/main/acercade" onclick="document.getElementById('sidebar').classList.add('translate-x-full'); document.getElementById('menuButton').classList.remove('hidden');" class="flex items-center gap-3 hover:bg-pink-100 py-2 px-4 rounded-md transition">
       <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 4a8 8 0 100 16 8 8 0 000-16z" />

    <a routerLink="/main/terminos" onclick="document.getElementById('sidebar').classList.add('translate-x-full'); document.getElementById('menuButton').classList.remove('hidden');" class="flex items-center gap-3 hover:bg-pink-100 py-2 px-4 rounded-md transition">
       <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h6m-1 8H6a2 2 0 01-2-2V6a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2z" />

    <!-- Puedes seguir agregando más botones aquí y el scroll funcionará sin afectar el cierre ni el encabezado -->
  </div>
<div class="flex items-center justify-center mt-0 px-4 text-sm italic gap-2">
  <!-- Texto indicador de modo -->
  <span class="self-center -translate-y-0.5" [ngClass]="isDarkMode ? 'text-yellow-400' : 'text-gray-700'">
    {{ isDarkMode ? 'Modo Oscuro' : 'Modo Claro' }}
  </span>

  <!-- Botón toggle -->
  <button (click)="toggleTheme()"
          class="relative w-10 h-5 -translate-y-0.5 bg-gray-300 dark:bg-gray-600 rounded-full transition-colors duration-300">
    <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-300"
          [ngClass]="isDarkMode ? 'translate-x-5 bg-yellow-400' : 'translate-x-0 bg-gray-100'">
    </span>
  </button>
</div>

 <!-- Botones fijos en la parte inferior -->

  <button (click)="cerrarSesion()"  class="w-full bg-pink-500 text-white py-2 rounded-md hover:bg-pink-600 transition">
    🔓 Cerrar sesión
