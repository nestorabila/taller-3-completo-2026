<div class="relative min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-200 via-gray-300 to-gray-400 dark:from-gray-800 dark:via-gray-700 dark:to-gray-600 overflow-hidden">
  
  <!-- Burbujas flotantes animadas -->
  <div class="absolute w-72 h-72 bg-white/10 rounded-full animate-bubble1 top-[-50px] left-[-50px]"></div>
  <div class="absolute w-56 h-56 bg-white/20 rounded-full animate-bubble2 bottom-[-40px] right-[-40px]"></div>
  <div class="absolute w-96 h-96 bg-white/5 rounded-full animate-bubble3 top-[20%] right-[-60px]"></div>
  
  <!-- Burbujas adicionales -->
  <div class="absolute w-48 h-48 bg-white/10 rounded-full animate-bubble4 top-[10%] left-[60%]"></div>
  <div class="absolute w-64 h-64 bg-white/15 rounded-full animate-bubble5 bottom-[20%] left-[30%]"></div>
  <div class="absolute w-32 h-32 bg-white/20 rounded-full animate-bubble6 top-[70%] right-[20%]"></div>
  <div class="absolute w-40 h-40 bg-white/10 rounded-full animate-bubble7 bottom-[10%] right-[50%]"></div>

  <!-- Contenedor principal del login con efecto vidrio -->
  <div class="animate__animated animate__zoomIn relative z-10 flex flex-col justify-center px-6 py-12 
              bg-white/20 dark:bg-gray-900/20 backdrop-blur-lg rounded-xl shadow-2xl w-full max-w-md 
              border border-white/30 dark:border-gray-700/30 transition-colors duration-500">

    <!-- Botón alternar tema -->
    <button class="absolute top-4 right-4 flex items-center px-3 py-2 rounded-full hover:bg-blue-100/30 dark:hover:bg-gray-700/30 text-blue-600 dark:text-blue-400 transition"
            (click)="toggleTheme()">
      <i [ngClass]="isDarkMode ? 'pi pi-sun text-lg' : 'pi pi-moon text-lg'"></i>
    </button>

    <!-- Logo y título -->
    <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center">
      <img class="mx-auto h-12 w-auto mb-4" src="assets/logo1.png" alt="Your Company" />
      <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100 tracking-tight">
        Inicia sesión con tu cuenta
      </h2>
    </div>

    <!-- Mensaje -->
    <div *ngIf="mostrarMensaje"
         class="fixed top-20 left-1/2 z-50 w-auto max-w-md px-6 py-3 rounded-lg shadow-lg text-center text-base font-medium pointer-events-none transition-all duration-500 ease-out transform"
         [ngClass]="[
           tipoMensaje === 'success'
             ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300 ring-1 ring-green-200'
             : 'bg-pink-50 text-pink-800 dark:bg-pink-900 dark:text-pink-300 ring-1 ring-pink-200',
           (desapareciendo ? 'opacity-0 -translate-y-2' : 'opacity-100 translate-y-0')
         ]"
         style="transform: translateX(-50%);">
      {{ mensaje }}
    </div>

    <!-- Formulario -->
    <form class="mt-6 space-y-6" (ngSubmit)="ingresar()">
      <div>
        <label for="usuario" class="block text-sm font-medium text-gray-900 dark:text-gray-100">Nombre Usuario</label>
        <input id="usuario" name="usuario" type="text" placeholder="Ingrese su nombre de usuario"
               [(ngModel)]="credenciales.usuario" required
               class="mt-2 block w-full rounded-lg bg-white/30 dark:bg-gray-800/30 px-3 py-2 text-base text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-400 focus:outline-2 focus:outline-pink-700 transition-all duration-300 sm:text-sm shadow-sm backdrop-blur-sm" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-900 dark:text-gray-100">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Ingrese su contraseña"
               [(ngModel)]="credenciales.contrasena" required
               class="mt-2 block w-full rounded-lg bg-white/30 dark:bg-gray-800/30 px-3 py-2 text-base text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-400 focus:outline-2 focus:outline-pink-700 transition-all duration-300 sm:text-sm shadow-sm backdrop-blur-sm" />
      </div>

      <div class="flex items-center justify-between mt-2">
        <div class="flex items-center gap-2">
          <input id="remember" type="checkbox" class="h-4 w-4 text-pink-700 focus:ring-pink-700 border-gray-300 rounded" />
          <label for="remember" class="text-sm text-gray-900 dark:text-gray-100">Recuérdame</label>
        </div>
      </div>

     <button type="submit" 
        [disabled]="!credenciales.usuario || !credenciales.contrasena || cargando"
        class="w-full relative rounded-lg bg-pink-700 hover:bg-pink-600 text-white py-2 px-4 font-semibold shadow-lg transition-all duration-300 focus:outline-2 focus:outline-pink-700 h-10 flex items-center justify-center">

  <!-- Contenedor que mantiene el texto centrado; loader se posiciona absoluto dentro del botón -->
  <span class="relative flex items-center justify-center w-full">
    <!-- Texto: mantenemos espacio usando opacity en vez de visibility -->
    <span [class.opacity-0]="cargando">Iniciar sesión</span>
  </span>

  <!-- Loader centrado sobre el botón (posicionado respecto al botón que es relative) -->
  <span *ngIf="cargando" class="absolute inset-0 flex items-center justify-center">
    <span class="loader mostrar"></span>
  </span>
</button>



    </form>

    <p class="mt-5 text-center text-sm text-gray-700 dark:text-gray-300">
      ¡Bienvenido a <span class="font-semibold text-pink-700">LUCIWEB</span>!<br>
      Tu espacio digital para organizar, crecer y avanzar.
    </p>
  </div>
</div>
